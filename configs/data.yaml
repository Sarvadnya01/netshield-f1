data:
  raw_dir: data/raw/ciciot2023
  processed_dir: data/processed
  interim_dir: data/interim
  partitions_dir: data/partitions
  stream_dir: data/stream
  serving_dir: models/serving

  # Per-class cap applied during ETL (null = no cap)
  class_cap: null

  # Split fractions (applied after stream holdout)
  split:
    stream_fraction: 0.03
    train: 0.8
    val: 0.1
    test: 0.1

  # Cap training rows per class (null = no cap, keep all of rarer classes)
  train_cap_per_class: 300000

  # Total cap for val and test sets (null = no cap)
  val_test_total_cap: 1000000

  # Feature stats file for preprocessing
  feature_stats: models/serving/feature_stats.json

etl:
  dedupe_scope: global   # "global" (dropDuplicates) or "per_file" (cheaper fallback)
  seed: 42
