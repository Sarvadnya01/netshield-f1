[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netshield"
version = "0.1.0"
description = "Real-time federated IoT intrusion detection on CICIoT2023"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pyyaml>=6.0,<7",
    "pydantic>=2.0,<3",
    "numpy>=1.26,<2",
    "pandas>=2.2,<2.3",
    "pyarrow>=15,<18",
    "python-dotenv>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
